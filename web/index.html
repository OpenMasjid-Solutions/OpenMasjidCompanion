<html lang="en" dir="ltr" data-theme="dark" data-wallpaper="aurora">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the page reaches under a phone's notch and home bar; the
         layout pads itself back with env(safe-area-inset-*). This is a page people hold
         in one hand at Fajr, not a desktop panel. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030D1A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F0F9FF" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Your masjid's prayer times, on your phone." />
    <!-- The real, installable manifest is GENERATED per request by the server (it carries
         the masjid's own name and icon, and a scope that follows the tunnel path), so it
         is linked at runtime rather than here — see the server's PWA routes. -->
    <title>Prayer times</title>
    <!-- The pre-install browser tab. Relative hrefs on purpose: the server injects a
         `<base href>` per request, so these resolve under the tunnel prefix as well as
         at the root without either path being baked into the build. -->
    <link rel="icon" type="image/png" sizes="128x128" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <script>
      // Apply the persisted look before first paint, so opening the app in a dark room
      // never flashes a white screen. The full prefs module hydrates immediately after.
      try {
        var p = JSON.parse(localStorage.getItem('omc-prefs') || '{}');
        var t = p.theme === 'light' || p.theme === 'dark'
          ? p.theme
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        if (p.wallpaper) document.documentElement.setAttribute('data-wallpaper', p.wallpaper);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
